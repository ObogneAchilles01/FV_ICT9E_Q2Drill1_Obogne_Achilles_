<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f2eb;
            background-image: url("/Users/achillesobogne/Documents/untitled folder/image-bg.jpg");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .container {
            padding-top: 15px;
            max-width: 750px;
        }

        h1 {
            background-color: #30649d;
            color: white;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            border-radius: 50px;
            padding: 10px 25px;
            width: fit-content;
            margin: 0 auto;
        }

        #Lebron {
            display: block;
            width: 310px;
            height: 230px;
            object-fit: cover;
            border: 3px solid #30649d;
            border-radius: 30px;
            margin: 0 auto;
        }

        .row.gap-3 {
            justify-content: center;
            gap: 20px;
        }
        
        .row.gap-3 .col {
            background-color: #c8d2dc;
            flex: 0 0 220px;
            max-width: 220px;
            max-height: 200px;
            height: auto;
            border-radius: 12px;
            padding: 0 0 12px;
            border: 2px solid #30649d;
            box-sizing: border-box;


        }

        li {
            font-family: 'Trebuchet MS', sans-serif;
        }

        h2 {
            font-family: 'Trebuchet MS';
            font-weight: bold;
        }

        .row.gap-3 .col h2 {
            padding-left: 30px;
            padding-right: 8px;
            margin-bottom: 0;
            font-size: 20px;
            color: #222;
            text-align: center;
        }

        .row.gap-3 .col ul {
            padding-left: 20px;
            margin: 0;
            text-align: left;
        }

        .row.gap .col li {
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <h1> 🌟 A Guide to Basketball </h1>
        </div>

            <br>
                <img src="/Users/achillesobogne/Documents/untitled folder/Lebron1.jpg" alt="Player" id="Lebron">
            <br>

        <div class="row gap-3">
            <div class="col">
                <h2> Rules </h2>
                <ul>
                    <li> 5 players per team</li>
                    <li> The team with the most points wins</li>
                    <li> No traveling</li>
                    <li> Dribble every 2 steps</li>
            </ul>
        </div>

            <div class="col">
                <h2> Equipment </h2>
                <ul>
                    <li> Basketball </li>
                    <li> Hoop and Backboard</li>
                    <li> Basketball Shoes</li>
                    <li> Sportswear </li>
            </ul>
            </div>

            <div class="col">
                <h2> Techniques  </h2>
                <ul>
                    <li> Dribbling </li>
                    <li> Shooting </li>
                    <li> Layups</li>
                    <li> Passing </li>
                </ul>
            </div>
            
        </div>
    </div>
</body>
</html>
